<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book an Appointment | Bun-Bun Hair Salon</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">B</span><span><strong>BUN-BUN</strong><small>HAIR SALON</small></span></a><nav class="nav"><a href="index.html">Home</a><a href="services.html">Services</a><a class="active" href="booking.html">Booking</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><a class="nav-cta" href="booking.html">Book Now ↗</a></header><section class="booking-section"><div class="booking-container"><p class="eyebrow">BOOK YOUR LOOK</p><h1>Book Your Appointment</h1><p>Your request will be saved securely and you can also send the details to Bun-Bun on WhatsApp.</p><form id="bookingForm"><label>Full Name<input id="name" required autocomplete="name"></label><label>Phone Number<input id="phone" type="tel" required placeholder="0971234567"></label><label>Service<select id="service" required><option value="">Select a service</option><option value="Hair Dressing">Hair Dressing — K100–K300</option><option value="Manicure">Manicure — K100</option><option value="Pedicure">Pedicure — K100</option><option value="Makeup">Makeup — K80–K150</option></select></label><label>Service Location<select id="location" required><option value="">Select location</option><option value="Upstair Area, Lundazi">Upstairs Area, Lundazi</option><option value="Kanyama Site, Lusaka">Kanyama Site, Lusaka</option></select></label><label>Preferred Date<input id="date" type="date" required></label><label>Preferred Time<input id="time" type="time" required></label><label>Additional Request<textarea id="message" rows="4" placeholder="Any special request?"></textarea></label><button class="booking-button" type="submit">📲 Submit & Continue to WhatsApp</button><div id="bookingMessage" class="booking-message"></div></form></div></section><footer><p>© 2026 Bun-Bun Hair Salon. Beauty. Style. Confidence.</p></footer><script>
const SUPABASE_URL='https://cpfentirkmxzirnhjhgr.supabase.co';const SUPABASE_KEY='sb_publishable_MOt9jcP9HonkGbxQzSZCAA_Z4KpH28U';const form=document.getElementById('bookingForm');const name=document.getElementById('name'),phone=document.getElementById('phone'),service=document.getElementById('service'),location=document.getElementById('location'),time=document.getElementById('time'),message=document.getElementById('message');const msg=document.getElementById('bookingMessage');const date=document.getElementById('date');date.min=new Date().toISOString().split('T')[0];form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Saving your appointment...';msg.classList.add('show');const payload={customer_name:name.value.trim(),phone:phone.value.trim(),service:service.value,location:location.value,appointment_date:date.value,appointment_time:time.value,notes:message.value.trim()||null,status:'pending'};try{const res=await fetch(SUPABASE_URL+'/rest/v1/appointments',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!res.ok)throw new Error('Could not save booking');const text='Hello Bun-Bun Hair Salon!%0A%0ANEW APPOINTMENT BOOKING%0A%0AName: '+encodeURIComponent(payload.customer_name)+'%0APhone: '+encodeURIComponent(payload.phone)+'%0AService: '+encodeURIComponent(payload.service)+'%0ALocation: '+encodeURIComponent(payload.location)+'%0ADate: '+encodeURIComponent(payload.appointment_date)+'%0ATime: '+encodeURIComponent(payload.appointment_time)+'%0AAdditional Request: '+encodeURIComponent(payload.notes||'None');msg.textContent='Booking saved! Opening WhatsApp for confirmation...';window.open('https://wa.me/260971146826?text='+text,'_blank')}catch(err){msg.textContent='We could not save the booking. Please try WhatsApp directly or call +260 971 146 826.'}});
</script></body></html>
