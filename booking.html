<main class="page">
<p class="eyebrow">APPOINTMENT</p><h1>Book your beauty appointment</h1>
<form id="bookingForm">
<label>Name<input id="name" required></label>
<label>Phone<input id="phone" type="tel" required></label>
<label>Service<select id="service" required><option value="">Select a service</option><option>Hair Dressing</option><option>Makeup</option><option>Manicure</option><option>Pedicure</option></select></label>
<label>Location<select id="location" required><option value="">Select location</option><option>Lundazi</option><option>Kanyama / Lusaka</option><option>Service in Lusaka</option></select></label>
<label>Preferred date<input id="date" type="date" required></label>
<label>Preferred time<input id="time" type="time" required></label>
<label>Message<textarea id="message" rows="4" placeholder="Any extra details?"></textarea></label>
<button class="btn" type="submit">Send Booking via WhatsApp</button>
</form>
</main>
