<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment | Bun Bun Hair Salon</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="logo">Bun Bun Hair Salon</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="booking.html" class="active">Booking</a>
    <a href="about.html">About Us</a>
  </nav>
</header>

<section class="booking-section">
  <div class="booking-container">
    <h1>Book Your Appointment</h1>
    <p>Choose your service, preferred date and time. Your booking will be sent to us through WhatsApp for confirmation.</p>

    <form id="bookingForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="e.g. 0971234567" required>

      <label for="service">Select Service</label>
      <select id="service" required>
        <option value="">-- Select a service --</option>
        <option>Hair Dressing — K100–K300</option>
        <option>Manicure — K100</option>
        <option>Pedicure — K100</option>
        <option>Makeup — K80–K150</option>
      </select>

      <label for="location">Service Location</label>
      <select id="location" required>
        <option value="">-- Select location --</option>
        <option>Upstairs Area, Lundazi</option>
        <option>Kanyama Site, Lusaka</option>
        <option>Other Lusaka Location</option>
      </select>

      <label for="date">Preferred Date</label>
      <input type="date" id="date" required>

      <label for="time">Preferred Time</label>
      <input type="time" id="time" required>

      <label for="message">Additional Request</label>
      <textarea id="message" rows="4" placeholder="Any special request?"></textarea>

      <button type="submit" class="booking-button">📲 Book via WhatsApp</button>
    </form>
  </div>
</section>

<footer>
  <p>© 2026 Bun Bun Hair Salon. All Rights Reserved.</p>
</footer>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const service = document.getElementById("service").value;
  const location = document.getElementById("location").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;
  const message = document.getElementById("message").value;

  const whatsappNumber = "260971146826";

  const text =
    "Hello Bun Bun Hair Salon!\n\n" +
    "NEW APPOINTMENT BOOKING\n\n" +
    "Name: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Service: " + service + "\n" +
    "Location: " + location + "\n" +
    "Date: " + date + "\n" +
    "Time: " + time + "\n" +
    "Additional Request: " + (message || "None");

  window.open("https://wa.me/" + whatsappNumber + "?text=" + encodeURIComponent(text), "_blank");
});
</script>
</body>
</html>
