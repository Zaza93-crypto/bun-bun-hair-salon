<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bun Bun Hair Salon | Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="loginView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">Bun Bun <span>Salon</span></div>
    <p class="eyebrow">PRIVATE ADMIN</p>
    <h1>Salon Dashboard</h1>
    <p class="muted">Sign in to manage customer appointments.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required placeholder="Admin email"></label>
      <label>Password<input id="password" type="password" required placeholder="Password"></label>
      <button class="btn" type="submit">Sign In</button>
      <p id="loginError" class="error"></p>
    </form>
  </div>
</div>

<div id="dashboardView" class="hidden">
<header class="topbar">
  <div><strong>Bun Bun Hair Salon</strong><span> Admin Dashboard</span></div>
  <button id="logoutBtn" class="logout">Sign out</button>
</header>

<main>
  <div class="heading">
    <div>
      <p class="eyebrow">APPOINTMENTS</p>
      <h1>Booking Management</h1>
    </div>
    <button id="refreshBtn" class="refresh">↻ Refresh</button>
  </div>

  <div class="stats">
    <div><span>Total</span><b id="total">0</b></div>
    <div><span>Pending</span><b id="pending">0</b></div>
    <div><span>Confirmed</span><b id="confirmed">0</b></div>
    <div><span>Completed</span><b id="completed">0</b></div>
  </div>

  <div class="toolbar">
    <select id="filter">
      <option value="all">All appointments</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="completed">Completed</option>
      <option value="cancelled">Cancelled</option>
    </select>
    <input id="search" type="search" placeholder="Search customer or phone...">
  </div>

  <div id="message" class="message"></div>
  <div id="appointments" class="appointments"></div>
</main>
</div>
<script src="admin.js"></script>
</body>
</html>
